    document.querySelectorAll('pre > code').forEach((codeblock) => {
        const container = codeblock.parentNode.parentNode;

        const copybutton = document.createElement('button');
        copybutton.classList.add('copy-code');
        copybutton.innerHTML = 'copy';

        function copyingDone() {
            copybutton.innerHTML = 'copied!';
            setTimeout(() => {
                copybutton.innerHTML = 'copy';
            }, 2000);
        }

        copybutton.addEventListener('click', (cb) => {
            if ('clipboard' in navigator) {
                navigator.clipboard.writeText(codeblock.textContent);
                copyingDone();
                return;
            }

            const range = document.createRange();
            range.selectNodeContents(codeblock);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            try {
                document.execCommand('copy');
                copyingDone();
            } catch (e) { };
            selection.removeRange(range);
        });

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.2/+esm';

const SUPABASE_URL = 'https://aipabrjoayengdkxohcu.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpcGFicmpvYXllbmdka3hvaGN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYzNjk5MjMsImV4cCI6MjA3MTk0NTkyM30.ZEV4BXWfcMaJGMAIaPVdzJpNCdsnYeEFGK0kzkqi0OE';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { persistSession: false } });


let sessionId = sessionStorage.getItem('tracking-session-id');
if (!sessionId) {
    sessionId = crypto.randomUUID();
    sessionStorage.setItem('tracking-session-id', sessionId);
}


const pageStartTime = Date.now();
const currentPage = window.location.pathname;


function getPageType(path) {
    if (path === '/' || path === '') return 'home';
    if (path.startsWith('/papers')) return 'papers';
    if (path.startsWith('/courses')) return 'teaching';
    if (path.startsWith('/gallery')) return 'gallery';
    if (path.startsWith('/location')) return 'location';
    return 'other';
}

const pageType = getPageType(currentPage);


async function recordPageView() {
    try {
        await sb.from('page_views').insert({
            session_id: sessionId,
            page_path: currentPage,
            page_type: pageType,
            referrer: document.referrer,
            ua: navigator.userAgent
        });
    } catch (e) {
        console.error('Failed to record page view:', e);
    }
}


async function updateTimeSpent() {
    const timeSpent = Math.round((Date.now() - pageStartTime) / 1000); 
    try {
        await sb.from('page_views')
            .update({ time_spent: timeSpent })
            .eq('session_id', sessionId)
            .eq('page_path', currentPage)
            .order('created_at', { ascending: false })
            .limit(1);
    } catch (e) {
        console.error('Failed to update time spent:', e);
    }
}


recordPageView();


window.addEventListener('beforeunload', () => {
    const timeSpent = Math.round((Date.now() - pageStartTime) / 1000);
    
    const data = JSON.stringify({
        session_id: sessionId,
        page_path: currentPage,
        time_spent: timeSpent
    });
    navigator.sendBeacon && navigator.sendBeacon(
        `${SUPABASE_URL}/rest/v1/rpc/update_page_time`,
        new Blob([data], { type: 'application/json' })
    );
});


document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        updateTimeSpent();
    }
});
</script>
